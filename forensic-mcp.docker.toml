# Config used inside the container (paths are container paths).
evidence_root = "/evidence"
output_root = "/output"
tools_file = "/app/tools.toml"
vol3_symbols_dir = "/home/analyst/.cache/volatility3/symbols"
# Inside the container the server must listen on all interfaces; docker-compose.yml
# publishes it on the Windows loopback only (127.0.0.1:8000).
http_host = "0.0.0.0"
http_port = 8000
api_token_file = "/app/.secrets/api_token"
# Host headers and browser origins accepted on /mcp (DNS-rebinding protection).
# The published HTTP endpoint is on the host loopback; allow only that endpoint by default.
allowed_hosts = ["localhost:8000", "127.0.0.1:8000"]
allowed_origins = ["http://localhost:8000", "http://127.0.0.1:8000"]
timeout_seconds = 1800
max_rows_returned = 100
max_cell_chars = 400
# Bounds (ET-02): one response, and stdout+stderr of one tool run.
max_response_kb = 64
max_output_mb = 1024
# Classification used when no case.toml applies (lab | internal | client).
default_classification = "internal"
# Task 4.3c: The Sleuth Kit binaries (Debian package sleuthkit) and the size bound of one
# file extracted from a disk image.
sleuthkit_dir = "/usr/bin"
max_extract_file_mb = 8192
# Data policy (ET-07): restrictive cloud by default. A local model needs a dedicated process
# started explicitly with `python -m forensic_mcp --stdio --llm-mode local`.
llm_mode = "cloud"
max_session_output_mb = 10240
