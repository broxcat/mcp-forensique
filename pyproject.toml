[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-mcp"
version = "0.1.0"
description = "Forensic MCP server exposing Volatility and Eric Zimmerman tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "volatility3",
    "uvicorn",
    "pyyaml",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
