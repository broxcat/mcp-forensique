# Vérité terrain du scénario (L3, tâche 3.2) — MODÈLE à remplir par l'équipe humaine
# (L. Plancke, W. Triffault) APRÈS avoir joué le scénario. L'assistant ne remplit aucun champ.
# Schéma : eval/ground_truth.schema.json (vérifié par tests/test_lab_eval.py).
# Sert à la notation (P7, eval/score.py) : rappel / précision des IOC et des étapes,
# comparaison des constats (record_finding) aux faits attendus ci-dessous.
#
# Règles :
#  - horodatages en UTC ISO-8601 avec Z (ex. 2026-10-05T14:32:07Z) ; noter le fuseau de chaque hôte ;
#  - identifiants ATT&CK confirmés par l'équipe d'après les tests réellement joués ;
#  - chaque fait attendu indique l'artefact et l'outil du serveur qui doivent le montrer ;
#    result_id / row sont remplis après une exécution de référence (sinon null) ;
#  - procedure_ref : référence du test officiel joué (rempli par l'équipe, jamais par l'assistant).
format: forensic-mcp/ground-truth/1
case: WS-042
status: template          # template -> filled (quand toutes les étapes sont renseignées)
filled_by: []             # noms des personnes qui ont rempli ce fichier
